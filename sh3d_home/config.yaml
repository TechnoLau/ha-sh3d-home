name: SH3D Home
version: "0.1.6"
slug: sh3d_home
description: "Sweet-Home-3D-Modelle als lebendiges 3D-Dashboard: Lichter, Türen, Fenster, Heizungen, Lautsprecher und Bildschirme mit Home Assistant verbinden."
url: https://github.com/TechnoLau/ha-sh3d-home
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-floor-3
panel_title: SH3D Home
panel_admin: false
homeassistant_api: true
hassio_api: true
hassio_role: default
watchdog: http://[HOST]:[PORT:8099]/api/health
ingress_stream: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
  - type: media
    read_only: false
options: {}
schema: {}
stage: stable
